name: Patch Produccion index

on:
  push:
    branches:
      - codex/produccion-integral-v1

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/produccion-integral-v1
          fetch-depth: 0

      - name: Insert production script safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          target = '<script src="sectorizacionV35.js?v=TIZ-V35-17-OBRAS-LIMPIAS-20260903"></script>'
          prod = '<script src="produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914"></script>'
          if text.count(target) != 1:
              raise SystemExit(f'Expected exactly one sectorizacionV35 script tag, found {text.count(target)}')
          if text.count(prod) > 1:
              raise SystemExit(f'Production script tag already duplicated: {text.count(prod)}')
          if prod not in text:
              text = text.replace(target, prod + '\n' + target, 1)
              p.write_text(text, encoding='utf-8')
          final = p.read_text(encoding='utf-8')
          if final.count(prod) != 1:
              raise SystemExit('Production script tag missing or duplicated after patch')
          expected = prod + '\n' + target
          if expected not in final:
              raise SystemExit('Production script is not immediately before sectorizacionV35.js')
          print('index.html load order OK')
          PY

      - name: Validate production JavaScript syntax and required behavior hooks
        shell: bash
        run: |
          node --check produccionV34.js
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('produccionV34.js','utf8');
          const must = [
            "const VERSION='PRODUCCION-INTEGRAL-V1-20260914'",
            "const BASE_RESPONSABLES=['Cristian','Caro','Pablo','Ariel','Gian','Juli']",
            'function render()',
            'window.p8Open=',
            'window.p8AddProcess=',
            'window.p8Save=async',
            "window.updateDoc_('obras',o.id,{gestionSectores:gestion})",
            'window.renderProduccionV34=render'
          ];
          for (const x of must) {
            if (!s.includes(x)) throw new Error('Missing required production hook: ' + x);
          }
          const html = fs.readFileSync('index.html','utf8');
          const prod = '<script src="produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914"></script>';
          const sec = '<script src="sectorizacionV35.js?v=TIZ-V35-17-OBRAS-LIMPIAS-20260903"></script>';
          if (html.indexOf(prod) < 0 || html.indexOf(sec) < 0 || html.indexOf(prod) > html.indexOf(sec)) {
            throw new Error('Incorrect production/sectorization script order');
          }
          console.log('Production behavior hooks OK');
          NODE

      - name: Commit only index change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-produccion-index.yml
          git config user.name "TIZ Production Validator"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/patch-produccion-index.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Load Produccion integral before sectorizacion"
          git push origin HEAD:codex/produccion-integral-v1
