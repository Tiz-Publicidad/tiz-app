name: Deploy Firestore access rules

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: tiz---app
          workload_identity_provider: projects/52620104053/locations/global/workloadIdentityPools/github-arca-constancia/providers/tiz-app
          service_account: github-arca-constancia@tiz---app.iam.gserviceaccount.com
      - name: Publish reviewed Firestore rules only
        run: firebase deploy --only firestore:rules --project tiz---app --non-interactive
