name: Validate ARCA fiscal address lookup
on:
  push:
    branches:
      - main
      - codex/domicilio-fiscal-arca-20260930
    paths:
      - '.github/workflows/deploy-arca-padron.yml'
      - 'functions/arcaPadronA5V125.js'
      - 'tests/arcaPadronV125.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  padron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lookup without issuing invoices
        run: |
          node --check functions/arcaPadronA5V125.js
          node --test tests/arcaPadronV125.test.js
