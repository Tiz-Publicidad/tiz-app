name: Deploy ARCA fiscal address lookup
on:
  push:
    branches:
      - main
      - codex/domicilio-fiscal-arca-20260930
    paths:
      - '.github/workflows/deploy-arca-padron.yml'
      - 'functions/arcaPadronA5V125.js'
      - 'tests/arcaPadronV125.test.js'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  padron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lookup without issuing invoices
        run: |
          node --check functions/arcaPadronA5V125.js
          node --test tests/arcaPadronV125.test.js
      - name: Install dependencies
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate with existing Google Cloud identity
        uses: google-github-actions/auth@v3
        with:
          project_id: tiz---app
          workload_identity_provider: projects/52620104053/locations/global/workloadIdentityPools/github-arca-constancia/providers/tiz-app
          service_account: github-arca-constancia@tiz---app.iam.gserviceaccount.com
      - name: Deploy only fiscal address lookup
        run: firebase deploy --only functions:arcaPadronConsultarV125 --project tiz---app --non-interactive
