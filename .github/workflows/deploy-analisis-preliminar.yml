name: Deploy analisis preliminar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/analisisPreliminar*.js'
      - '.github/workflows/deploy-analisis-preliminar.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: analisis-preliminar-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate preliminary analysis
        run: |
          node --check analisisPreliminarV1.js
          node --check functions/analisisPreliminarApiV1.js
          node --test tests/analisisPreliminarV1.test.cjs
      - run: npm ci
        working-directory: functions
      - run: npm install -g firebase-tools
      - uses: google-github-actions/auth@v3
        with:
          project_id: tiz---app
          workload_identity_provider: projects/52620104053/locations/global/workloadIdentityPools/github-arca-constancia/providers/tiz-app
          service_account: github-arca-constancia@tiz---app.iam.gserviceaccount.com
      - name: Deploy approval event and authenticated API
        run: firebase deploy --only functions:analisisPreliminarAprobacionV1,functions:analisisPreliminarV1 --project tiz---app --non-interactive
      - name: Deploy preliminary report access rules
        run: firebase deploy --only firestore:rules --project tiz---app --non-interactive
