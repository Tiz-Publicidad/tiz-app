name: Fix Facturacion V83 Params
on:
  push:
    branches: [codex/facturacion-cobranzas-integral-v1]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
          fetch-depth: 0
      - name: Patch params and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('functions/facturacionIntegralApiV83.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('const {facturas2026FolderId,issuerRazonSocial,issuerDomicilio,issuerCondicionIva,archivarFacturaPdfEnDrive}=require("./facturaDrive2026");','const {archivarFacturaPdfEnDrive}=require("./facturaDrive2026");')
          s=s.replace('const secrets=[cert,key,issuer,allowed,facturas2026FolderId,issuerRazonSocial,issuerDomicilio,issuerCondicionIva];','const secrets=[cert,key,issuer,allowed];')
          p.write_text(s,encoding='utf-8')
          p=Path('functions/facturacionDriveRetryV83.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('const {facturas2026FolderId,issuerRazonSocial,issuerDomicilio,issuerCondicionIva,archivarFacturaPdfEnDrive}=require("./facturaDrive2026");','const {archivarFacturaPdfEnDrive}=require("./facturaDrive2026");')
          s=s.replace('secrets:[issuer,allowed,facturas2026FolderId,issuerRazonSocial,issuerDomicilio,issuerCondicionIva]','secrets:[issuer,allowed]')
          p.write_text(s,encoding='utf-8')
          PY
          cd functions
          node --check facturaDrive2026.js
          node --check facturacionIntegralApiV83.js
          node --check facturacionDriveRetryV83.js
          node --check index.js
          grep -F 'const secrets=[cert,key,issuer,allowed];' facturacionIntegralApiV83.js
          grep -F 'secrets:[issuer,allowed]' facturacionDriveRetryV83.js
          grep -F '1XYk0vAIsGZCAiJ4s7TGyQYJdVBYvYdGy' facturaDrive2026.js
          cd ..
          git diff --check
      - name: Commit clean result
        run: |
          rm -f .github/workflows/fix-facturacion-v83-params.yml
          git config user.name "TIZ Facturacion Validator"
          git config user.email "actions@users.noreply.github.com"
          git add functions/facturacionIntegralApiV83.js functions/facturacionDriveRetryV83.js .github/workflows/fix-facturacion-v83-params.yml
          git diff --cached --check
          git commit -m "Make Facturacion V83 deploy-safe"
          git push origin HEAD:codex/facturacion-cobranzas-integral-v1
