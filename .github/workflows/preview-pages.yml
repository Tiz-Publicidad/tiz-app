name: Preview Produccion Copiloto V1

on:
  push:
    branches:
      - feature/produccion-copiloto-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: feature/produccion-copiloto-v1
          path: feature

      - name: Build real app with isolated Production V8
        shell: bash
        run: |
          rm -rf site
          cp -a stable/. site/
          rm -rf site/.git site/.github

          # Unico cambio sobre la app estable: modulo encapsulado de Produccion V8.
          cp feature/produccionIntegradaV8.js site/produccionIntegradaV8.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text()
          marker='<script src="produccionIntegradaV8.js?v=8.0.0"></script>'
          assert '</body>' in s
          s=s.replace('</body>', marker+'\n</body>')
          p.write_text(s)
          PY

          # Conservamos laboratorio como referencia visual, pero la raiz ya es la app real.
          mkdir -p site/lab/produccion-v7
          cp feature/lab/produccion-v7/index.html site/lab/produccion-v7/index.html
          echo "REAL_APP_PLUS_PRODUCTION_V8" > site/PRODUCTION_BUILD.txt
          touch site/.nojekyll

      - name: Verify stable core is untouched
        shell: bash
        run: |
          cmp stable/sectorizacionV35.js site/sectorizacionV35.js
          cmp stable/operacionesV31.js site/operacionesV31.js
          cmp stable/app.js site/app.js
          grep -q 'produccionIntegradaV8.js?v=8.0.0' site/index.html
          grep -q 'TIZ Produccion V8' site/produccionIntegradaV8.js
          grep -q 'REAL_APP_PLUS_PRODUCTION_V8' site/PRODUCTION_BUILD.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy real app + Production V8
        id: deployment
        uses: actions/deploy-pages@v4
