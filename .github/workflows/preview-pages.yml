name: Preview Produccion Copiloto V1

on:
  push:
    branches:
      - feature/produccion-copiloto-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/produccion-copiloto-v1
          path: preview-source

      - name: Build combined Pages site
        shell: bash
        run: |
          mkdir -p site/preview/produccion-copiloto-v1
          cp -a stable/. site/
          rm -rf site/.git site/.github
          cp -a preview-source/. site/preview/produccion-copiloto-v1/
          rm -rf site/preview/produccion-copiloto-v1/.git site/preview/produccion-copiloto-v1/.github
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy stable + preview
        id: deployment
        uses: actions/deploy-pages@v4
