name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify current TIZ modules
        shell: bash
        run: |
          set -e
          grep -q "PRODUCCION-INTEGRAL-V1-20260914" produccionV34.js
          grep -q 'produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914' index.html
          grep -q 'cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915' index.html
          grep -q 'cobranzasIndicadorEnvioV100.js?v=TIZ-V100-ESTADO-ENVIO-20260916' index.html
          grep -q 'cobranzasPorCobrarV101.js?v=TIZ-V1012-SOLO-FACTURAS-20260918' index.html
          grep -q 'cobranzasCompatFacturasV102.js?v=TIZ-V102-HISTORICAS-20260916' index.html
          grep -q 'cobranzasCompatPresupuestosV103.js?v=TIZ-V103-APROBADAS-20260916' index.html
          ! grep -q 'cobranzasUnificadasStableV76.js?v=' index.html
          ! grep -q 'cobranzasIntegralV73.js?v=' index.html
          ! grep -q 'cobranzasRestaurar4680y4701V72.js?v=' index.html
          node --check produccionV34.js
          node --check baseMadreSyncV111.js
          grep -q 'baseMadreSyncV111.js?v=TIZ-BASE-MADRE-SYNC-V1111-20260921' index.html
          node --check cobranzasVistaUnificadaV98.js
          node --check cobranzasIndicadorEnvioV100.js
          node --check cobranzasPorCobrarV101.js
          node --check cobranzasCompatFacturasV102.js
          node --check cobranzasCompatPresupuestosV103.js

      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf site
          mkdir -p site
          find . -mindepth 1 -maxdepth 1 ! -name site ! -name .git ! -name .github -exec cp -a {} site/ \;
          echo "MAIN_DIRECT_DEPLOY" > site/DEPLOY_SOURCE.txt
          git rev-parse HEAD > site/DEPLOY_COMMIT.txt
          touch site/.nojekyll

      - name: Verify prepared site
        shell: bash
        run: |
          set -e
          grep -q "PRODUCCION-INTEGRAL-V1-20260914" site/produccionV34.js
          grep -q 'produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914' site/index.html
          grep -q 'cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915' site/index.html
          grep -q 'cobranzasIndicadorEnvioV100.js?v=TIZ-V100-ESTADO-ENVIO-20260916' site/index.html
          grep -q 'cobranzasPorCobrarV101.js?v=TIZ-V1012-SOLO-FACTURAS-20260918' site/index.html
          grep -q 'cobranzasCompatFacturasV102.js?v=TIZ-V102-HISTORICAS-20260916' site/index.html
          grep -q 'cobranzasCompatPresupuestosV103.js?v=TIZ-V103-APROBADAS-20260916' site/index.html
          ! grep -q 'cobranzasUnificadasStableV76.js?v=' site/index.html
          ! grep -q 'cobranzasIntegralV73.js?v=' site/index.html
          ! grep -q 'cobranzasRestaurar4680y4701V72.js?v=' site/index.html
          test -f site/index.html
          test -f site/app.js
          test -f site/sectorizacionV35.js
          test -f site/baseMadreSyncV111.js
          grep -q 'baseMadreSyncV111.js?v=TIZ-BASE-MADRE-SYNC-V1111-20260921' site/index.html
          test -f site/cobranzasPorCobrarV101.js
          test -f site/cobranzasCompatFacturasV102.js
          test -f site/cobranzasCompatPresupuestosV103.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
