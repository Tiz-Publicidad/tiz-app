name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install report test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: functions

      - name: Verify current TIZ modules
        shell: bash
        run: |
          set -e
          head -n 1 index.html | grep -qi "<!DOCTYPE html>"
          ! grep -q "Warning: truncated output" index.html
          grep -q "</html>" index.html
          grep -q "PRODUCCION-INTEGRAL-V1-20260914" produccionV34.js
          grep -q 'produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914' index.html
          grep -q 'facturacionCobranzasDataV2.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' index.html
          grep -q 'facturacionCobranzasActionsV2.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' index.html
          grep -q 'facturacionBaseMadreReconcileV2.js?v=TIZ-BASE-MADRE-BIDIRECCIONAL-20260929C' index.html
          grep -q 'facturacionCobranzasUIV2.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' index.html
          node --check produccionV34.js
          node --check baseMadreSyncV116.js
          node --check sectorizacionV35.js
          grep -q 'sectorizacionV35.js?v=TIZ-V35-25-CONTACTO-OT-20260929' index.html
          grep -q 'baseMadreSyncV116.js?v=TIZ-BASE-MADRE-BIDIRECCIONAL-20260929C' index.html
          grep -q 'driveFolderNameSyncV110.js?v=TIZ-DRIVE-FOLDER-NAME-SYNC-V1103-NO-AUTO-POPUP-20260923' index.html
          grep -q 'facturadorIntegralV83.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' index.html
          grep -q 'facturacionDriveRetryUIV83.js?v=TIZ-FC-DRIVE-AUTO-20260930' index.html
          node --check facturacionCobranzasDataV2.js
          node --check facturacionCobranzasActionsV2.js
          node --check facturacionBaseMadreReconcileV2.js
          node --check facturacionCobranzasUIV2.js
          node --check facturacionDriveRetryUIV83.js
          node --test tests/facturacionDriveAutomaticoV126.test.cjs
          node --check cobranzasSemanalV127.js
          node --check colocacionesV128.js
          node --check colocacionesGeneralUIV129.js
          node --check functions/colocacionesCoreV129.js
          node --check functions/colocacionesSheetV130.js
          node --test tests/colocacionesSheetV130.test.cjs
          node --test tests/colocacionesRoutingV130.test.cjs tests/colocacionesGeneralV129.test.cjs
          grep -Fq 'colocacionesV128.js?v=TIZ-COLOCACIONES-V139-20261009' index.html
          node --test tests/colocacionesV128.test.cjs tests/colocacionesEntradaV136.test.cjs
          node --test tests/cobranzasSemanalV127.test.cjs
          node --test tests/baseMadreFilaExplicita.test.js tests/baseMadreReconcileV123.test.js tests/baseMadreSafetyV124.test.js tests/baseMadreBackendSafetyV124.test.js tests/facturacionManualV2.test.js

      - name: Remove test dependencies from static site
        run: rm -rf functions/node_modules

      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf site
          mkdir -p site
          find . -mindepth 1 -maxdepth 1 ! -name site ! -name .git ! -name .github -exec cp -a {} site/ \;
          echo "MAIN_DIRECT_DEPLOY" > site/DEPLOY_SOURCE.txt
          git rev-parse HEAD > site/DEPLOY_COMMIT.txt
          touch site/.nojekyll

      - name: Verify prepared site
        shell: bash
        run: |
          set -e
          grep -q "PRODUCCION-INTEGRAL-V1-20260914" site/produccionV34.js
          grep -q 'produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914' site/index.html
          grep -q 'facturacionCobranzasDataV2.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' site/index.html
          grep -q 'facturacionCobranzasActionsV2.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' site/index.html
          grep -q 'facturacionBaseMadreReconcileV2.js?v=TIZ-BASE-MADRE-BIDIRECCIONAL-20260929C' site/index.html
          grep -q 'facturacionCobranzasUIV2.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' site/index.html
          test -f site/index.html
          test -f site/colocacionesV128.js
          test -f site/colocacionesGeneralUIV129.js
          test -f site/functions/colocacionesCoreV129.js
          test ! -d site/functions/node_modules
          test -f site/app.js
          test -f site/sectorizacionV35.js
          test -f site/baseMadreSyncV116.js
          grep -q 'baseMadreSyncV116.js?v=TIZ-BASE-MADRE-BIDIRECCIONAL-20260929C' site/index.html
          grep -q 'driveFolderNameSyncV110.js?v=TIZ-DRIVE-FOLDER-NAME-SYNC-V1103-NO-AUTO-POPUP-20260923' site/index.html
          grep -q 'facturadorIntegralV83.js?v=TIZ-FC-PAGOS-SEMANAS-20260930' site/index.html
          grep -q 'facturacionDriveRetryUIV83.js?v=TIZ-FC-DRIVE-AUTO-20260930' site/index.html
          test -f site/facturacionCobranzasDataV2.js
          test -f site/facturacionCobranzasActionsV2.js
          test -f site/facturacionBaseMadreReconcileV2.js
          test -f site/facturacionCobranzasUIV2.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record Pages deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          printf '{"state":"%s","context":"tiz-pages-pv0003","description":"Pages %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/pages-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/pages-status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

