name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Production V8 is in main
        shell: bash
        run: |
          grep -q "PRODUCCION-V8-20260829" produccionV34.js
          grep -q "Producción V8" produccionV34.js

      - name: Prepare site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          find . -mindepth 1 -maxdepth 1 ! -name site ! -name .git ! -name .github -exec cp -a {} site/ \;
          echo "MAIN_DIRECT_DEPLOY" > site/DEPLOY_SOURCE.txt
          git rev-parse HEAD > site/DEPLOY_COMMIT.txt
          touch site/.nojekyll

      - name: Verify prepared site
        shell: bash
        run: |
          grep -q "PRODUCCION-V8-20260829" site/produccionV34.js
          test -f site/index.html
          test -f site/app.js
          test -f site/sectorizacionV35.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
