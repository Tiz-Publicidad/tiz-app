name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify current TIZ modules
        shell: bash
        run: |
          set -e
          grep -q "PRODUCCION-INTEGRAL-V1-20260914" produccionV34.js
          grep -q 'produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914' index.html
          grep -q 'facturacionCobranzasDataV2.js?v=TIZ-FC-COBROS-PARCIALES-20260929' index.html
          grep -q 'facturacionCobranzasActionsV2.js?v=TIZ-FC-COBROS-PARCIALES-20260929' index.html
          grep -q 'facturacionBaseMadreReconcileV2.js?v=TIZ-FC-BASE-MADRE-V20-20260921' index.html
          grep -q 'facturacionCobranzasUIV2.js?v=TIZ-FC-COBROS-PARCIALES-20260929' index.html
          node --check produccionV34.js
          node --check baseMadreSyncV116.js
          node --check sectorizacionV35.js
          grep -q 'sectorizacionV35.js?v=TIZ-V35-25-CONTACTO-OT-20260929' index.html
          grep -q 'baseMadreSyncV116.js?v=TIZ-BASE-MADRE-FILA-EXPLICITA-20260929' index.html
          grep -q 'driveFolderNameSyncV110.js?v=TIZ-DRIVE-FOLDER-NAME-SYNC-V1103-NO-AUTO-POPUP-20260923' index.html
          grep -q 'facturadorIntegralV83.js?v=TIZ-FC-PV0003-NC-20260928' index.html
          grep -q 'facturacionDriveRetryUIV83.js?v=TIZ-FC-V2-DRIVE-V124-OAUTH-FALLBACK-20260923' index.html
          node --check facturacionCobranzasDataV2.js
          node --check facturacionCobranzasActionsV2.js
          node --check facturacionBaseMadreReconcileV2.js
          node --check facturacionCobranzasUIV2.js
          node --check facturacionDriveRetryUIV83.js

      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf site
          mkdir -p site
          find . -mindepth 1 -maxdepth 1 ! -name site ! -name .git ! -name .github -exec cp -a {} site/ \;
          echo "MAIN_DIRECT_DEPLOY" > site/DEPLOY_SOURCE.txt
          git rev-parse HEAD > site/DEPLOY_COMMIT.txt
          touch site/.nojekyll

      - name: Verify prepared site
        shell: bash
        run: |
          set -e
          grep -q "PRODUCCION-INTEGRAL-V1-20260914" site/produccionV34.js
          grep -q 'produccionV34.js?v=TIZ-PRODUCCION-INTEGRAL-V1-20260914' site/index.html
          grep -q 'facturacionCobranzasDataV2.js?v=TIZ-FC-COBROS-PARCIALES-20260929' site/index.html
          grep -q 'facturacionCobranzasActionsV2.js?v=TIZ-FC-COBROS-PARCIALES-20260929' site/index.html
          grep -q 'facturacionBaseMadreReconcileV2.js?v=TIZ-FC-BASE-MADRE-V20-20260921' site/index.html
          grep -q 'facturacionCobranzasUIV2.js?v=TIZ-FC-COBROS-PARCIALES-20260929' site/index.html
          test -f site/index.html
          test -f site/app.js
          test -f site/sectorizacionV35.js
          test -f site/baseMadreSyncV116.js
          grep -q 'baseMadreSyncV116.js?v=TIZ-BASE-MADRE-FILA-EXPLICITA-20260929' site/index.html
          grep -q 'driveFolderNameSyncV110.js?v=TIZ-DRIVE-FOLDER-NAME-SYNC-V1103-NO-AUTO-POPUP-20260923' site/index.html
          grep -q 'facturadorIntegralV83.js?v=TIZ-FC-PV0003-NC-20260928' site/index.html
          grep -q 'facturacionDriveRetryUIV83.js?v=TIZ-FC-V2-DRIVE-V124-OAUTH-FALLBACK-20260923' site/index.html
          test -f site/facturacionCobranzasDataV2.js
          test -f site/facturacionCobranzasActionsV2.js
          test -f site/facturacionBaseMadreReconcileV2.js
          test -f site/facturacionCobranzasUIV2.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record Pages deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          printf '{"state":"%s","context":"tiz-pages-pv0003","description":"Pages %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/pages-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/pages-status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
