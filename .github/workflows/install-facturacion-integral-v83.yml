name: Install Facturacion Integral V83
on:
  push:
    branches: [codex/facturacion-cobranzas-integral-v1]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
          fetch-depth: 0
      - name: Patch entrypoints safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('functions/index.js')
          s=idx.read_text(encoding='utf-8')
          block='\n// TIZ V83 - Facturacion y Cobranzas integral\nconst { facturacionIntegralEmitirV83 } = require("./facturacionIntegralApiV83");\nexports.facturacionIntegralEmitirV83 = facturacionIntegralEmitirV83;\n'
          if 'exports.facturacionIntegralEmitirV83' not in s:
              s=s.rstrip()+block
              idx.write_text(s,encoding='utf-8')
          html=Path('index.html')
          h=html.read_text(encoding='utf-8')
          anchor='<script src="precioSyncV82.js?v=TIZ-PRECIO-SYNC-V82-20260914"></script>'
          a='<script src="facturadorIntegralV83.js?v=TIZ-FACTURADOR-INTEGRAL-V83-20260914"></script>'
          b='<script src="facturacionPuestoV83.js?v=TIZ-FACTURACION-PUESTO-V83-20260914"></script>'
          if h.count(anchor)!=1: raise SystemExit(f'price sync anchor invalid: {h.count(anchor)}')
          for tag in (a,b):
              if h.count(tag)>1: raise SystemExit('duplicate '+tag)
          if a not in h or b not in h:
              h=h.replace(anchor,anchor+'\n'+a+'\n'+b,1)
              html.write_text(h,encoding='utf-8')
          final=html.read_text(encoding='utf-8')
          if not (final.index(anchor)<final.index(a)<final.index(b)): raise SystemExit('V83 load order invalid')
          PY
      - name: Update dependencies and validate syntax
        run: |
          cd functions
          npm install --package-lock-only --ignore-scripts
          node --check index.js
          node --check facturaDrive2026.js
          node --check arcaFiscalCoreV83.js
          node --check facturacionIntegralApiV83.js
          cd ..
          node --check facturadorIntegralV83.js
          node --check facturacionPuestoV83.js
          grep -F 'exports.facturacionIntegralEmitirV83' functions/index.js
          grep -F 'facturadorIntegralV83.js?v=TIZ-FACTURADOR-INTEGRAL-V83-20260914' index.html
          grep -F 'facturacionPuestoV83.js?v=TIZ-FACTURACION-PUESTO-V83-20260914' index.html
          git diff --check
      - name: Commit validated integration
        run: |
          rm -f .github/workflows/install-facturacion-integral-v83.yml
          git config user.name "TIZ Facturacion Validator"
          git config user.email "actions@users.noreply.github.com"
          git add functions/index.js functions/package-lock.json index.html .github/workflows/install-facturacion-integral-v83.yml
          git diff --cached --check
          git commit -m "Integrate Facturacion y Cobranzas integral V83"
          git push origin HEAD:codex/facturacion-cobranzas-integral-v1
