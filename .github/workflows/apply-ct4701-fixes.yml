name: Apply CT 4701 fixes

on:
  push:
    branches:
      - fix/ct4701-drive-facturacion
    paths:
      - .github/workflows/apply-ct4701-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ct4701-drive-facturacion
          fetch-depth: 0
      - name: Apply safe source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')

          old = """// Autocomplete cliente para presupuesto
window.sugerirClientesPP = (q) => {
  const dd = document.getElementById('pp-clientes-dropdown');
  if (!q || q.length < 1) { dd.style.display='none'; return; }
  const clientesDB = window.DB.clientes.map(c=>({nombre:c.nombre,cuit:c.cuit}));
  const clientesObras = [...new Set(window.DB.obras.map(o=>o.cliente).filter(Boolean))]
    .filter(n=>!clientesDB.find(c=>c.nombre?.toLowerCase()===n.toLowerCase()))
    .map(n=>({nombre:n,cuit:''}));
  const todos = [...clientesDB,...clientesObras];
  const matches = todos.filter(c=>c.nombre&&c.nombre.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  let html = matches.map(c=>`
    <div class=\"cli-option\" onmousedown=\"elegirClientePP('${c.nombre.replace(/'/g,\"\\\\'\")}')\">
      <span>${resaltar(c.nombre,q)}</span>
      ${c.cuit?`<span class=\"cli-option-sub\">CUIT: ${c.cuit}</span>`:`<span class=\"cli-option-sub\">de obras anteriores</span>`}
    </div>`).join('');
  html += `<div class=\"cli-option\" onmousedown=\"nuevoClienteDesdePresupuesto('${q.replace(/'/g,\"\\\\'\")}'')\" style=\"border-top:1px solid var(--border);color:var(--accent)\">
    <span>➕ Crear cliente \"<strong>${q}</strong>\"</span>
    <span class=\"cli-option-sub\" style=\"color:var(--accent)\">Abre el formulario de nuevo cliente</span>
  </div>`;
  dd.innerHTML = html;
  dd.style.display = 'block';
};
"""
          new = """// Autocomplete cliente para presupuesto — V65: lista completa + alta inmediata
window.sugerirClientesPP = (q='', mostrarTodos=false) => {
  const dd = document.getElementById('pp-clientes-dropdown');
  if (!dd) return;
  const term = String(q||'').trim();
  const normCli = v => String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();
  const clientesDB = (window.DB?.clientes||[])
    .filter(c=>c?.nombre)
    .map(c=>({id:c.id||'',nombre:String(c.nombre).trim(),cuit:c.cuit||'',origen:'clientes'}));
  const nombresDB = new Set(clientesDB.map(c=>normCli(c.nombre)));
  const clientesObras = [...new Set((window.DB?.obras||[]).map(o=>String(o.cliente||'').trim()).filter(Boolean))]
    .filter(n=>!nombresDB.has(normCli(n)))
    .map(n=>({id:'',nombre:n,cuit:'',origen:'obras'}));
  const todos = [...clientesDB,...clientesObras]
    .sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'}));
  const matches = term
    ? todos.filter(c=>normCli(c.nombre).includes(normCli(term))).slice(0,50)
    : (mostrarTodos ? todos.slice(0,50) : []);
  if (!matches.length && !term) { dd.style.display='none'; return; }
  let html = matches.map(c=>`
    <div class=\"cli-option\" onmousedown=\"elegirClientePP('${c.nombre.replace(/'/g,\"\\\\'\")}')\">
      <span>${term && window.resaltar ? resaltar(c.nombre,term) : c.nombre}</span>
      ${c.cuit?`<span class=\"cli-option-sub\">CUIT: ${c.cuit}</span>`:`<span class=\"cli-option-sub\">${c.origen==='obras'?'de obras anteriores':'cliente guardado'}</span>`}
    </div>`).join('');
  const exacto = term && todos.some(c=>normCli(c.nombre)===normCli(term));
  if (term && !exacto) {
    const safe = term.replace(/'/g,\"\\\\'\");
    html += `<div class=\"cli-option\" onmousedown=\"nuevoClienteDesdePresupuesto('${safe}')\" style=\"border-top:1px solid var(--border);color:var(--accent)\">
      <span>➕ Crear cliente \"<strong>${term}</strong>\"</span>
      <span class=\"cli-option-sub\" style=\"color:var(--accent)\">Guardar y usar inmediatamente en esta cotización</span>
    </div>`;
  }
  dd.innerHTML = html || '<div class=\"cli-option-sub\" style=\"padding:9px\">No hay clientes.</div>';
  dd.style.display = 'block';
};
"""
          if old not in s:
              raise SystemExit('No se encontró el bloque de autocomplete esperado en app.js')
          s = s.replace(old, new, 1)

          old_save = """  const id = window.editingId.cliente;
  if (id) await updateDoc_('clientes', id, data);
  else await addDoc_('clientes', data);
"""
          new_save = """  const id = window.editingId.cliente;
  if (id) {
    await updateDoc_('clientes', id, data);
    const local=(window.DB?.clientes||[]).find(c=>c.id===id); if(local) Object.assign(local,data);
  } else {
    const ref = await addDoc_('clientes', data);
    if(ref?.id && Array.isArray(window.DB?.clientes) && !window.DB.clientes.some(c=>c.id===ref.id)) window.DB.clientes.push({id:ref.id,...data});
  }
"""
          if old_save not in s:
              raise SystemExit('No se encontró el guardado de clientes esperado en app.js')
          s = s.replace(old_save, new_save, 1)
          app.write_text(s, encoding='utf-8')

          cobr = Path('cobranzasDesdeObrasV41.js')
          c = cobr.read_text(encoding='utf-8')
          old_total = "    f.total=num(raw.total||o?.neto);"
          new_total = "    f.total=num(raw.total||o?.neto||o?.infoPresupuesto?.importe||o?.gestionSectores?.facturacion?.importePresupuestado||o?.gestionSectores?.cobranzas?.montoTotal||o?.sectores?.facturacion?.importePresupuestado||o?.sectores?.cobranzas?.montoTotal);"
          if old_total not in c:
              raise SystemExit('No se encontró el cálculo financiero esperado')
          c = c.replace(old_total, new_total, 1)
          cobr.write_text(c, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = re.sub(r'app\\.js\\?v=[^\"\\']+', 'app.js?v=TIZ-V65-CLIENTES-COTIZADOR-20260907', h)
          h = re.sub(r'cobranzasDesdeObrasV41\\.js\\?v=[^\"\\']+', 'cobranzasDesdeObrasV41.js?v=TIZ-V65-COLA-FACTURACION-20260907', h)
          idx.write_text(h, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check app.js
          node --check cobranzasDesdeObrasV41.js
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js cobranzasDesdeObrasV41.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corregir cola de facturación y clientes del cotizador"
          git push origin HEAD:fix/ct4701-drive-facturacion
