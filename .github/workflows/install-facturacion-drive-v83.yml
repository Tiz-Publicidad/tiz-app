name: Install Facturacion Drive Retry V83
on:
  push:
    branches: [codex/facturacion-cobranzas-integral-v1]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
          fetch-depth: 0
      - name: Patch and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('functions/index.js'); s=idx.read_text(encoding='utf-8')
          block='\nconst { facturacionReintentarDriveV83 } = require("./facturacionDriveRetryV83");\nexports.facturacionReintentarDriveV83 = facturacionReintentarDriveV83;\n'
          if 'exports.facturacionReintentarDriveV83' not in s:
              idx.write_text(s.rstrip()+block,encoding='utf-8')
          html=Path('index.html'); h=html.read_text(encoding='utf-8')
          anchor='<script src="facturacionPuestoV83.js?v=TIZ-FACTURACION-PUESTO-V83-20260914"></script>'
          tag='<script src="facturacionDriveRetryUIV83.js?v=TIZ-FACTURACION-DRIVE-V83-20260914"></script>'
          if h.count(anchor)!=1: raise SystemExit('workstation anchor invalid')
          if h.count(tag)>1: raise SystemExit('drive retry duplicated')
          if tag not in h:
              html.write_text(h.replace(anchor,anchor+'\n'+tag,1),encoding='utf-8')
          PY
          cd functions
          node --check facturacionDriveRetryV83.js
          node --check index.js
          cd ..
          node --check facturacionDriveRetryUIV83.js
          grep -F 'exports.facturacionReintentarDriveV83' functions/index.js
          grep -F 'facturacionDriveRetryUIV83.js?v=TIZ-FACTURACION-DRIVE-V83-20260914' index.html
          git diff --check
      - name: Commit clean result
        run: |
          rm -f .github/workflows/install-facturacion-drive-v83.yml
          git config user.name "TIZ Facturacion Validator"
          git config user.email "actions@users.noreply.github.com"
          git add functions/index.js index.html .github/workflows/install-facturacion-drive-v83.yml
          git diff --cached --check
          git commit -m "Integrate fiscal PDF retry V83"
          git push origin HEAD:codex/facturacion-cobranzas-integral-v1
