name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Validate fiscal code
        run: |
          node --test tests/giancarloAdminV1.test.cjs
          node --check clemenSecretariaV1.js
          node --check clemenSecretariaCoreV1.js
          node --test tests/clemenSecretariaV1.test.cjs
          node --check estadisticaSourceV1.js
          node --test tests/estadisticaSourceV1.test.cjs
          node --check operacionesV1.js
          node --test tests/operacionesV1.test.cjs
          node --check analisisPreliminarV1.js
          node --check functions/analisisPreliminarApiV1.js
          node --test tests/analisisPreliminarV1.test.cjs tests/analisisIndicadoresV1.test.cjs
          node --check colocacionesGeneralUIV129.js
          node --test tests/colocacionesV131.test.cjs
          node --check functions/index.js
          node --check functions/arcaFechasV1.js
          node --check facturadorIntegralV83.js
          node --check functions/arcaFceMinimoV1.js
          node --test tests/arcaFceMinimoV1.test.cjs
          node --test tests/arcaFechasV1.test.cjs tests/arcaFceV1.test.cjs tests/arcaFceDiagnosticoV1.test.cjs
          node --check functions/facturacionIntegralApiV83.js
          node --check functions/facturaDrive2026.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/baseMadreBackendV120.js
          node --check functions/baseMadreLayoutV1.js
          node --test tests/baseMadreLayoutV1.test.cjs tests/baseMadreFilaExplicita.test.js tests/baseMadreBackendSafetyV124.test.js
          node --test tests/calidadV1.test.cjs tests/calidadBaseMadre.test.cjs
          node --check functions/obrasConsultaV1.js
          node --test tests/obrasConsultaV1.test.cjs
          node --check obrasSeguimientoV2.js
          node --check functions/obrasSeguimientoCoreV2.js
          node --check functions/obrasSeguimientoApiV2.js
          node --test tests/obrasSeguimientoV2.test.cjs tests/obrasSeguimientoApiV2.test.cjs
          node --check calidadChecklistsV2.js
          node --check functions/calidadChecklistCoreV2.js
          node --check functions/calidadChecklistApiV2.js
          node --test tests/calidadChecklistV2.test.cjs tests/calidadPortalV1.test.cjs
          node --check functions/arcaPadronA5V125.js
          node --test tests/arcaPadronV125.test.js
          node --check functions/colocacionesGeneralV129.js
          node --check functions/colocacionesCoreV129.js
          node --check functions/colocacionesSheetV130.js
          node --test tests/colocacionesRoutingV130.test.cjs tests/colocacionesGeneralV129.test.cjs tests/colocacionesSheetV130.test.cjs
          node --check functions/condicionesPagoV127.js
          node --test tests/cobranzasSemanalV127.test.cjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: tiz---app
          workload_identity_provider: projects/52620104053/locations/global/workloadIdentityPools/github-arca-constancia/providers/tiz-app
          service_account: github-arca-constancia@tiz---app.iam.gserviceaccount.com
      - name: Check Firebase project access
        run: firebase projects:list --json --non-interactive | grep -q 'tiz---app'
      - name: Configure issuer environment
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF
      - name: Deploy changed functions
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          targets=functions:facturacionIntegralEmitirV83,functions:facturacionReintentarDriveV83,functions:sincronizarBaseMadreV120,functions:arcaPadronConsultarV125
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            if printf '%s\n' "$changed" | grep -Eq '^functions/arcaPadronA5V125[.]js$' && ! printf '%s\n' "$changed" | grep -Ev '^(functions/arcaPadronA5V125.js|tests/arcaPadronV125.test.js|.github/workflows/deploy-functions.yml|.github/workflows/deploy-arca-padron.yml)$' | grep -q .; then
              targets=functions:arcaPadronConsultarV125
            fi
          fi
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            backend_changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- functions/)
            if [ -n "$backend_changed" ] && ! printf '%s\n' "$backend_changed" | grep -Ev '^functions/(facturacionIntegralApiV83|condicionesPagoV127|arcaFechasV1|arcaFceV1|facturaDrive2026)\.js$' | grep -q .; then
              targets=functions:facturacionIntegralEmitirV83,functions:facturacionReintentarDriveV83
            fi
          fi
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            colocaciones_changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- functions/)
            if [ -n "$colocaciones_changed" ] && ! printf '%s\n' "$colocaciones_changed" | grep -Ev '^functions/(colocacionesGeneralV129|colocacionesCoreV129|colocacionesSheetV130|colocacionesPortalV153|allFunctionsV86|facturacionIntegralApiV83)\.js$' | grep -q .; then
              targets=functions:facturacionIntegralEmitirV83
            fi
            if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- colocacionesV128.js | grep -q . && ! printf '%s\n' "$colocaciones_changed" | grep -Ev '^functions/(colocacionesGeneralV129|colocacionesCoreV129|colocacionesSheetV130|colocacionesPortalV153|allFunctionsV86|facturacionIntegralApiV83)\.js$' | grep -q .; then
              targets=functions:facturacionIntegralEmitirV83
            fi
          fi
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            quality_changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- functions/)
            if printf '%s\n' "$quality_changed" | grep -Eq '^functions/(calidadChecklist(Core|Api)V2|calidadPortalV1|obrasSeguimiento(Core|Api)V2)\.js$'; then
              if ! printf '%s\n' "$quality_changed" | grep -Ev '^functions/(calidadChecklistCoreV2|calidadChecklistApiV2|calidadPortalV1|obrasSeguimientoCoreV2|obrasSeguimientoApiV2|allFunctionsV86|baseMadreBackendV120)\.js$' | grep -q .; then
                targets=functions:sincronizarBaseMadreV120
              else
                targets="$targets,functions:sincronizarBaseMadreV120"
              fi
            fi
          fi
          # Preliminary analysis uses the already authorized Base Madre API.
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(functions/(analisisPreliminar.*|baseMadreBackendV120|allFunctionsV86)\.js|.github/workflows/deploy-functions.yml)$'; then
            targets="$targets,functions:sincronizarBaseMadreV120"
          fi
          # Operational readers and the secretary reuse the existing Base Madre endpoint.
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            secretary_changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- functions/)
            if [ -n "$secretary_changed" ] && ! printf '%s\n' "$secretary_changed" | grep -Ev '^functions/(clemenSecretaria(Core|Api)V1|analisisPreliminar(Core|Api)V1|operacionesV1|obrasConsultaV1|calidadChecklistApiV2|calidadPortalV1|obrasSeguimiento(Core|Api)V2|baseMadreLayoutV1|baseMadreBackendV120)\.js$' | grep -q .; then
              targets=functions:sincronizarBaseMadreV120
            fi
          fi
          # Account permissions are checked by every fiscal entry point separately.
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^functions/(index|facturacionEntregaV84|facturacionRecuperarV86)\.js$'; then
            targets="$targets,functions:arcaProduccionStatus,functions:arcaProduccionEmitirOT4680,functions:facturaEnviarEmail,functions:arcaHomologacionStatus,functions:arcaHomologacionEmitirPrueba,functions:facturacionHomologacionArchivarV84,functions:facturacionEnviarEmailV84,functions:facturacionRecuperarHistoricosV86"
          fi
          firebase deploy --only "$targets" --project tiz---app --non-interactive
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(firestore.rules|firebase.json)$'; then
            firebase deploy --only firestore:rules --project tiz---app --non-interactive
          fi
      - name: Record deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          printf '{"state":"%s","context":"facturacion-v83-pv0003","description":"Deploy %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/deploy-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/deploy-status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
