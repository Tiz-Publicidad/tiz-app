name: Activar nucleo operativo V80

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activar-facturacion-v67.yml'
      - 'tizCoreOperativoV80.js'
      - 'activarRefactorV80.js'

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Consolidar Facturacion y Cobranzas en V80
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          # Retira solamente las capas que compiten por renderCobranzas. Conserva
          # V41 (modal Gestionar) y V67 (emision ARCA), que V80 reutiliza.
          legacy=[
            'facturacionCobranzasBridgeV68.js','cobranzasUnificadasV69.js',
            'cobranzasEstadoGestionV70.js','cobranzasRecuperarFacturadasV71.js',
            'cobranzasRestaurar4680y4701V72.js','cobranzasIntegralV73.js',
            'cobranzasWatchdogV74.js','cobranzas4680V75.js','cobranzasUnificadasStableV76.js',
            'activarRefactorV80.js','tizCoreOperativoV80.js'
          ]
          for name in legacy:
              text=re.sub(r'<script src="'+re.escape(name)+r'(?:\?v=[^"]*)?"></script>\s*','',text)
          tag='<script src="activarRefactorV80.js?v=TIZ-V80-CORE-20260907-2028"></script>'
          pos=text.rfind('</body>')
          if pos<0: raise SystemExit('No se encontro </body> en index.html')
          text=text[:pos]+tag+'\n'+text[pos:]
          p.write_text(text,encoding='utf-8')

      - name: Commit y push si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ya estaba consolidado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Consolidar Facturacion y Cobranzas en V80"
          git push origin main
