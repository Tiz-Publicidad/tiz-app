name: Activar facturacion V67 y cobranzas V68-V71

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activar-facturacion-v67.yml'
      - 'facturacionProduccionV67.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasRecuperarFacturadasV71.js'

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Insertar scripts V67 a V71 en index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<script src="facturacionProduccionV67.js?v=TIZ-V67-ARCA-PROD-PV9-20260907"></script>',
              '<script src="facturacionCobranzasBridgeV68.js?v=TIZ-V68-ARCA-COBRAR-20260907"></script>',
              '<script src="cobranzasUnificadasV69.js?v=TIZ-V69-COBRANZAS-UNIFICADAS-20260907"></script>',
              '<script src="cobranzasEstadoGestionV70.js?v=TIZ-V70-ESTADO-GESTION-20260907"></script>',
              '<script src="cobranzasRecuperarFacturadasV71.js?v=TIZ-V71-RECUPERAR-FACTURADAS-20260907"></script>',
          ]
          marker = '</body>'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('No se encontro </body> en index.html')
          changed = False
          for tag in tags:
              if tag not in text:
                  text = text[:pos] + tag + '\n' + text[pos:]
                  pos += len(tag) + 1
                  changed = True
          if changed:
              p.write_text(text, encoding='utf-8')

      - name: Commit y push si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ya estaba actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activar recuperacion universal de facturas V71 en index"
          git push origin main
