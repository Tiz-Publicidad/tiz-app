name: Activar facturacion V67

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activar-facturacion-v67.yml'
      - 'facturacionProduccionV67.js'

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Insertar script V67 en index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="facturacionProduccionV67.js?v=TIZ-V67-ARCA-PROD-PV9-20260907"></script>'
          if tag not in text:
              marker = '</body>'
              pos = text.rfind(marker)
              if pos < 0:
                  raise SystemExit('No se encontro </body> en index.html')
              text = text[:pos] + tag + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')

      - name: Commit y push si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ya estaba actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activar interfaz facturacion V67 en index"
          git push origin main
