name: Activar facturacion V67 y cobranzas V68-V74

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activar-facturacion-v67.yml'
      - 'facturacionProduccionV67.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasRecuperarFacturadasV71.js'
      - 'cobranzasRestaurar4680y4701V72.js'
      - 'cobranzasIntegralV73.js'
      - 'cobranzasWatchdogV74.js'

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Actualizar scripts de cobranzas en index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          # Reemplaza cualquier referencia anterior de V74 para forzar que el navegador baje el JS nuevo.
          text = re.sub(r'<script src="cobranzasWatchdogV74\.js\?v=[^"]+"></script>\s*', '', text)
          tag = '<script src="cobranzasWatchdogV74.js?v=TIZ-V742-FC4680-FIX-20260907-2215"></script>'
          marker = '</body>'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('No se encontro </body> en index.html')
          text = text[:pos] + tag + '\n' + text[pos:]
          p.write_text(text, encoding='utf-8')

      - name: Commit y push si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ya estaba actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Forzar carga V74.2 para FC 4680"
          git push origin main
