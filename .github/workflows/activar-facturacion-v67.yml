name: Activar facturacion V67 y cobranzas V68-V76

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activar-facturacion-v67.yml'
      - 'facturacionProduccionV67.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasRecuperarFacturadasV71.js'
      - 'cobranzasRestaurar4680y4701V72.js'
      - 'cobranzasIntegralV73.js'
      - 'cobranzasWatchdogV74.js'
      - 'cobranzas4680V75.js'
      - 'cobranzasUnificadasStableV76.js'

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Actualizar scripts de cobranzas en index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          for name in ['cobranzasWatchdogV74.js','cobranzas4680V75.js','cobranzasUnificadasStableV76.js']:
              text=re.sub(r'<script src="'+re.escape(name)+r'\?v=[^"]+"></script>\s*','',text)
          # V76 reemplaza los parches especiales: la regla se aplica a todas las OT.
          tag='<script src="cobranzasUnificadasStableV76.js?v=TIZ-V76-COBRANZAS-GENERAL-20260907-2300"></script>'
          pos=text.rfind('</body>')
          if pos<0: raise SystemExit('No se encontro </body> en index.html')
          text=text[:pos]+tag+'\n'+text[pos:]
          p.write_text(text,encoding='utf-8')

      - name: Commit y push si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ya estaba actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activar cobranzas generales V76"
          git push origin main
