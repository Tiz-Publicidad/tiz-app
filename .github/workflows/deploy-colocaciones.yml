name: Deploy Colocaciones
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/colocacionesGeneralV129.js'
      - 'functions/colocacionesCoreV129.js'
      - 'functions/colocacionesSheetV130.js'
      - '.github/workflows/deploy-colocaciones.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: colocaciones-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - name: Validate Colocaciones
        run: |
          node --check functions/colocacionesGeneralV129.js
          node --check functions/colocacionesCoreV129.js
          node --check functions/colocacionesSheetV130.js
          node --test tests/colocacionesGeneralV129.test.cjs tests/colocacionesSheetV130.test.cjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: tiz---app
          workload_identity_provider: projects/52620104053/locations/global/workloadIdentityPools/github-arca-constancia/providers/tiz-app
          service_account: github-arca-constancia@tiz---app.iam.gserviceaccount.com
      - name: Deploy Colocaciones service
        run: firebase deploy --only functions:colocacionesGeneralV129 --project tiz---app --non-interactive
