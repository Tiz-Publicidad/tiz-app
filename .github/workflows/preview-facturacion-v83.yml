name: Preview Facturacion V83

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'facturadorIntegralV83.js'
      - 'facturacionEntregaUIV84.js'
      - 'facturacionPuestoV83.js'
      - 'facturacionDriveRetryUIV83.js'
      - 'facturacionAnticiposV85.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasVistaUnificadaV98.js'
      - 'cobranzasIndicadorEnvioV100.js'
      - 'cobranzasPorCobrarV101.js'
      - 'cobranzasCompatFacturasV102.js'
      - 'cobranzasCompatPresupuestosV103.js'
      - 'cobranzasGestionUnificadaV104.js'
      - 'cobranzasEstabilidadV105.js'
      - 'index.html'
      - 'functions/**'
      - '.github/workflows/preview-facturacion-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cobranzas final chain
        shell: bash
        run: |
          set -e
          node --check cobranzasVistaUnificadaV98.js
          node --check cobranzasIndicadorEnvioV100.js
          node --check cobranzasPorCobrarV101.js
          node --check cobranzasCompatFacturasV102.js
          node --check cobranzasCompatPresupuestosV103.js
          node --check cobranzasGestionUnificadaV104.js
          node --check cobranzasEstabilidadV105.js
          node --check facturacionDriveRetryUIV83.js
          node --check facturadorIntegralV83.js
          node --check facturacionEntregaUIV84.js
          node --check functions/index.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/facturaDrive2026.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="facturacionDriveRetryUIV83.js?v=TIZ-V97-DRIVE-SIN-DOM-20260914"></script>',
              '<script src="cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915"></script>',
              '<script src="cobranzasIndicadorEnvioV100.js?v=TIZ-V100-ESTADO-ENVIO-20260916"></script>',
              '<script src="cobranzasPorCobrarV101.js?v=TIZ-V101-FACTURACION-COBRANZA-20260916"></script>',
              '<script src="cobranzasCompatFacturasV102.js?v=TIZ-V102-HISTORICAS-20260916"></script>',
              '<script src="cobranzasCompatPresupuestosV103.js?v=TIZ-V103-APROBADAS-20260916"></script>',
              '<script src="cobranzasGestionUnificadaV104.js?v=TIZ-V104-ESTADO-UNIFICADO-20260916"></script>',
              '<script src="cobranzasEstabilidadV105.js?v=TIZ-V105-ESTABILIDAD-20260916"></script>'
          ]
          names=[
              'facturacionDriveRetryUIV83.js','cobranzasVistaUnificadaV98.js','cobranzasIndicadorEnvioV100.js',
              'cobranzasPorCobrarV101.js','cobranzasCompatFacturasV102.js','cobranzasCompatPresupuestosV103.js',
              'cobranzasGestionUnificadaV104.js','cobranzasEstabilidadV105.js'
          ]
          for name in names:
              s=re.sub(r'\n?<script src="'+re.escape(name)+r'\?v=[^"]+"></script>\n?', '\n', s)
          body_idx=s.rfind('</body>'); html_idx=s.rfind('</html>')
          if body_idx < 0 or html_idx < 0 or body_idx > html_idx:
              raise SystemExit('index.html has invalid final body/html structure')
          chain='\n'.join(tags)+'\n'
          s=s[:body_idx]+chain+s[body_idx:]
          for tag in tags:
              if s.count(tag)!=1: raise SystemExit('loader count invalid: '+tag)
          positions=[s.index(tag) for tag in tags]
          if positions!=sorted(positions): raise SystemExit('Cobranzas loader order is invalid')
          expected_tail=chain+'</body>\n</html>'
          if not s.rstrip().endswith(expected_tail): raise SystemExit('final Cobranzas chain is not at document boundary')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit repaired Cobranzas loader chain
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "TIZ Preview Validator"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git diff --cached --check
            git commit -m "Repair final Cobranzas loader chain"
            git push origin HEAD:codex/facturacion-cobranzas-integral-v1
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase authentication
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIZ_APP }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "No Firebase credential is configured. Add FIREBASE_SERVICE_ACCOUNT_TIZ_APP (recommended) or refresh FIREBASE_TOKEN."
            exit 1
          fi

      - name: Validate Firebase authentication
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase projects:list --json --non-interactive >/tmp/firebase-projects.json
          else
            firebase projects:list --json --token "$FIREBASE_TOKEN" --non-interactive >/tmp/firebase-projects.json
          fi
          grep -q 'tiz---app' /tmp/firebase-projects.json

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy email delivery function
        id: email_function
        continue-on-error: true
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --non-interactive
          else
            firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
          fi

      - name: Report email function status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.email_function.outcome }}" != "success" ]; then
            echo "Email function deploy is not a prerequisite for the hosting preview smoke test."
          fi

      - name: Prepare Firebase preview config
        shell: bash
        run: |
          cat > firebase.preview.json <<'EOF'
          {"hosting":{"public":".","ignore":["firebase.preview.json","firebase.json",".firebaserc",".git/**",".github/**","functions/**","node_modules/**"]}}
          EOF

      - name: Deploy isolated preview channel
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --non-interactive
          else
            firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
          fi

      - name: Smoke test final Cobranzas view
        shell: bash
        run: |
          set -e
          ORIGIN='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app'
          for file in cobranzasVistaUnificadaV98.js cobranzasPorCobrarV101.js cobranzasGestionUnificadaV104.js cobranzasEstabilidadV105.js; do
            curl -fsSL "$ORIGIN/$file" -o "/tmp/$file"
            node --check "/tmp/$file"
          done
          grep -F 'Saldo a cobrar' /tmp/cobranzasPorCobrarV101.js
          grep -F 'tizV101Open' /tmp/cobranzasPorCobrarV101.js
          grep -F 'Estado de la factura' /tmp/cobranzasEstabilidadV105.js
          curl -fsSL "$ORIGIN/" -o /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          tags=[
              '<script src="facturacionDriveRetryUIV83.js?v=TIZ-V97-DRIVE-SIN-DOM-20260914"></script>',
              '<script src="cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915"></script>',
              '<script src="cobranzasIndicadorEnvioV100.js?v=TIZ-V100-ESTADO-ENVIO-20260916"></script>',
              '<script src="cobranzasPorCobrarV101.js?v=TIZ-V101-FACTURACION-COBRANZA-20260916"></script>',
              '<script src="cobranzasCompatFacturasV102.js?v=TIZ-V102-HISTORICAS-20260916"></script>',
              '<script src="cobranzasCompatPresupuestosV103.js?v=TIZ-V103-APROBADAS-20260916"></script>',
              '<script src="cobranzasGestionUnificadaV104.js?v=TIZ-V104-ESTADO-UNIFICADO-20260916"></script>',
              '<script src="cobranzasEstabilidadV105.js?v=TIZ-V105-ESTABILIDAD-20260916"></script>'
          ]
          for tag in tags:
              if s.count(tag)!=1: raise SystemExit('deployed loader count invalid: '+tag)
          pos=[s.index(tag) for tag in tags]
          if pos!=sorted(pos): raise SystemExit('deployed loader order is invalid')
          chain='\n'.join(tags)+'\n'
          if not s.rstrip().endswith(chain+'</body>\n</html>'):
              raise SystemExit('deployed final chain is not at the final document boundary')
          PY
