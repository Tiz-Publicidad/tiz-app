name: Preview Facturacion V83

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'facturadorIntegralV83.js'
      - 'facturacionEntregaUIV84.js'
      - 'facturacionPuestoV83.js'
      - 'facturacionDriveRetryUIV83.js'
      - 'facturacionAnticiposV85.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasIntegralV73.js'
      - 'cobranzasUnificadasStableV76.js'
      - 'index.html'
      - 'functions/**'
      - '.github/workflows/preview-facturacion-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate single-owner Cobranzas V97
        shell: bash
        run: |
          set -e
          node --check cobranzasUnificadasStableV76.js
          node --check facturacionDriveRetryUIV83.js
          node --check facturacionCobranzasBridgeV68.js
          node --check cobranzasUnificadasV69.js
          node --check cobranzasEstadoGestionV70.js
          node --check cobranzasIntegralV73.js
          node --check facturacionAnticiposV85.js
          node --check facturadorIntegralV83.js
          node --check facturacionEntregaUIV84.js
          node --check functions/index.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/facturaDrive2026.js
          python3 - <<'PY'
          from pathlib import Path
          legacy=['facturacionCobranzasBridgeV68.js','cobranzasUnificadasV69.js','cobranzasEstadoGestionV70.js','cobranzasIntegralV73.js','facturacionAnticiposV85.js','facturacionDriveRetryUIV83.js']
          forbidden=['MutationObserver','setInterval(','cobr-modulo-v48 table tbody','querySelectorAll(\'#cobr-modulo-v48 table','function decorateTable','scheduleDecorate']
          for name in legacy:
              s=Path(name).read_text(encoding='utf-8')
              for bad in forbidden:
                  if bad in s:
                      raise SystemExit(f'{name} still mutates/polls Cobranzas: {bad}')
          stable=Path('cobranzasUnificadasStableV76.js').read_text(encoding='utf-8')
          required=['<th class="fv93-pdf-head">PDF</th>','${pdfEstado(o)}','${selectEstado(o,x)}','Archivar PDF']
          for token in required:
              if token not in stable: raise SystemExit(f'stable Cobranzas missing: {token}')
          if stable.count('${selectEstado(o,x)}') != 1:
              raise SystemExit('Estado selector must exist exactly once in stable row')
          drive=Path('facturacionDriveRetryUIV83.js').read_text(encoding='utf-8')
          for token in ['reauthenticateWithPopup','recuperarPdfFacturaV86','window.renderCobranzas?.()']:
              if token not in drive: raise SystemExit(f'Drive module missing: {token}')
          for bad in ['MutationObserver','setInterval(','decorateTable','scheduleDecorate']:
              if bad in drive: raise SystemExit(f'Drive module must not touch table: {bad}')
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          versions={
            'facturacionCobranzasBridgeV68.js':'TIZ-V97-SINGLE-OWNER-20260914',
            'cobranzasUnificadasV69.js':'TIZ-V97-SINGLE-OWNER-20260914',
            'cobranzasEstadoGestionV70.js':'TIZ-V97-SINGLE-OWNER-20260914',
            'cobranzasIntegralV73.js':'TIZ-V97-SINGLE-OWNER-20260914',
            'cobranzasUnificadasStableV76.js':'TIZ-V97-COBRANZAS-ESTABLE-20260914',
            'facturacionAnticiposV85.js':'TIZ-V97-SINGLE-OWNER-20260914',
            'facturacionDriveRetryUIV83.js':'TIZ-V97-DRIVE-SIN-DOM-20260914',
          }
          import re
          for file,ver in versions.items():
              pat=rf'<script src="{re.escape(file)}\?v=[^"]+"></script>'
              s,n=re.subn(pat,f'<script src="{file}?v={ver}"></script>',s,count=1)
              if n!=1: raise SystemExit(f'script tag missing: {file}')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit V97 cache bust
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "TIZ Preview Validator"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git diff --cached --check
            git commit -m "Load single-owner Cobranzas V97"
            git push origin HEAD:codex/facturacion-cobranzas-integral-v1
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy email delivery function
        run: firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Prepare Firebase preview config
        shell: bash
        run: |
          cat > firebase.preview.json <<'EOF'
          {"hosting":{"public":".","ignore":["firebase.preview.json","firebase.json",".firebaserc",".git/**",".github/**","functions/**","node_modules/**"]}}
          EOF

      - name: Deploy isolated preview channel
        run: firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Smoke test served single-owner Cobranzas V97
        shell: bash
        run: |
          set -e
          ORIGIN='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app'
          for asset in \
            'facturacionCobranzasBridgeV68.js?v=TIZ-V97-SINGLE-OWNER-20260914' \
            'cobranzasUnificadasV69.js?v=TIZ-V97-SINGLE-OWNER-20260914' \
            'cobranzasEstadoGestionV70.js?v=TIZ-V97-SINGLE-OWNER-20260914' \
            'cobranzasIntegralV73.js?v=TIZ-V97-SINGLE-OWNER-20260914' \
            'facturacionAnticiposV85.js?v=TIZ-V97-SINGLE-OWNER-20260914' \
            'facturacionDriveRetryUIV83.js?v=TIZ-V97-DRIVE-SIN-DOM-20260914'; do
            curl -fsSL "$ORIGIN/$asset" -o /tmp/a.js
            if grep -Eq 'MutationObserver|setInterval\(|decorateTable|scheduleDecorate' /tmp/a.js; then exit 1; fi
            node --check /tmp/a.js
          done
          curl -fsSL "$ORIGIN/cobranzasUnificadasStableV76.js?v=TIZ-V97-COBRANZAS-ESTABLE-20260914" -o /tmp/stable.js
          grep -F '<th class="fv93-pdf-head">PDF</th>' /tmp/stable.js
          grep -F '${pdfEstado(o)}' /tmp/stable.js
          node --check /tmp/stable.js
          curl -fsSL "$ORIGIN/" -o /tmp/index.html
          grep -F 'cobranzasUnificadasStableV76.js?v=TIZ-V97-COBRANZAS-ESTABLE-20260914' /tmp/index.html
          grep -F 'facturacionDriveRetryUIV83.js?v=TIZ-V97-DRIVE-SIN-DOM-20260914' /tmp/index.html
