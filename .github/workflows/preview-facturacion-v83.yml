name: Preview Facturacion V83

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'facturadorIntegralV83.js'
      - 'facturacionEntregaUIV84.js'
      - 'facturacionPuestoV83.js'
      - 'facturacionDriveRetryUIV83.js'
      - 'facturacionAnticiposV85.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasIntegralV73.js'
      - 'cobranzasUnificadasStableV76.js'
      - 'cobranzasVistaUnificadaV98.js'
      - 'index.html'
      - 'functions/**'
      - '.github/workflows/preview-facturacion-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate unified Por cobrar V98
        shell: bash
        run: |
          set -e
          node --check cobranzasVistaUnificadaV98.js
          node --check facturacionDriveRetryUIV83.js
          node --check facturadorIntegralV83.js
          node --check facturacionEntregaUIV84.js
          node --check functions/index.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/facturaDrive2026.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          v98=Path('cobranzasVistaUnificadaV98.js').read_text(encoding='utf-8')
          required=['Por cobrar · facturación y gestión','PDF en Drive y factura enviada','Facturar saldo','window.renderCobranzas=render','/gestiones/i','PDF pendiente','En Drive']
          for token in required:
              if token not in v98: raise SystemExit(f'V98 missing: {token}')
          for bad in ['MutationObserver','setInterval(']:
              if bad in v98: raise SystemExit(f'V98 must not poll/mutate continuously: {bad}')
          if "const factBtn=!fact" in v98:
              raise SystemExit('V98 must never offer Facturar when an invoice already exists')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="cobranzasVistaUnificadaV98.js?v=TIZ-V98-POR-COBRAR-UNIFICADO-20260915"></script>'
          s=re.sub(r'\n?<script src="cobranzasVistaUnificadaV98\.js\?v=[^"]+"></script>\n?','\n',s)
          if '</body>' not in s: raise SystemExit('index.html missing </body>')
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit V98 loader
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "TIZ Preview Validator"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git diff --cached --check
            git commit -m "Load unified Por cobrar V98"
            git push origin HEAD:codex/facturacion-cobranzas-integral-v1
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy email delivery function
        run: firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Prepare Firebase preview config
        shell: bash
        run: |
          cat > firebase.preview.json <<'EOF'
          {"hosting":{"public":".","ignore":["firebase.preview.json","firebase.json",".firebaserc",".git/**",".github/**","functions/**","node_modules/**"]}}
          EOF

      - name: Deploy isolated preview channel
        run: firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Smoke test unified Por cobrar V98
        shell: bash
        run: |
          set -e
          ORIGIN='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app'
          curl -fsSL "$ORIGIN/cobranzasVistaUnificadaV98.js?v=TIZ-V98-POR-COBRAR-UNIFICADO-20260915" -o /tmp/v98.js
          node --check /tmp/v98.js
          grep -F 'Por cobrar · facturación y gestión' /tmp/v98.js
          grep -F 'Facturar saldo' /tmp/v98.js
          grep -F 'window.renderCobranzas=render' /tmp/v98.js
          if grep -Eq 'MutationObserver|setInterval\(' /tmp/v98.js; then exit 1; fi
          curl -fsSL "$ORIGIN/" -o /tmp/index.html
          grep -F 'cobranzasVistaUnificadaV98.js?v=TIZ-V98-POR-COBRAR-UNIFICADO-20260915' /tmp/index.html
