name: Preview Facturacion V83

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'facturacionHomologacionUIV83.js'
      - 'facturadorIntegralV83.js'
      - 'facturacionPuestoV83.js'
      - 'functions/index.js'
      - '.github/workflows/preview-facturacion-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare homologation preview safely
        shell: bash
        run: |
          node --check facturacionHomologacionUIV83.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="facturacionHomologacionUIV83.js?v=TIZ-FV83-HOMO-20260914"></script>'
          anchor='<script src="facturadorIntegralV83.js?v=TIZ-FACTURADOR-INTEGRAL-V83-20260914"></script>'
          if tag not in s:
              if s.count(anchor)!=1: raise SystemExit(f'anchor count {s.count(anchor)}')
              s=s.replace(anchor,anchor+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          if p.read_text(encoding='utf-8').count(tag)!=1: raise SystemExit('homologation tag invalid')

          f=Path('functions/index.js'); fs=f.read_text(encoding='utf-8')
          old='const ALLOWED_ORIGINS = new Set(["https://tiz-publicidad.github.io", "http://localhost:5000", "http://127.0.0.1:5000"]);'
          new='const ALLOWED_ORIGINS = new Set(["https://tiz-publicidad.github.io", "https://tiz---app.web.app", "https://tiz---app.firebaseapp.com", "https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app", "http://localhost:5000", "http://127.0.0.1:5000"]);'
          if old in fs:
              fs=fs.replace(old,new,1)
              f.write_text(fs,encoding='utf-8')
          elif new not in fs:
              raise SystemExit('ALLOWED_ORIGINS signature not found')
          PY
      - name: Commit preview safety changes to branch
        shell: bash
        run: |
          if ! git diff --quiet -- index.html functions/index.js; then
            git config user.name "TIZ Preview Validator"
            git config user.email "actions@users.noreply.github.com"
            git add index.html functions/index.js
            git diff --cached --check
            git commit -m "Allow Firebase preview for ARCA homologation"
            git push origin HEAD:codex/facturacion-cobranzas-integral-v1
          fi
      - name: Install function dependencies
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF
      - name: Deploy homologation function only
        run: firebase deploy --only functions:arcaHomologacionEmitirPrueba --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Prepare Firebase preview config
        shell: bash
        run: |
          cat > firebase.preview.json <<'EOF'
          {
            "hosting": {
              "public": ".",
              "ignore": [
                "firebase.preview.json",
                "firebase.json",
                ".firebaserc",
                ".git/**",
                ".github/**",
                "functions/**",
                "node_modules/**"
              ],
              "rewrites": [
                {
                  "source": "/api/homologacion",
                  "function": {
                    "functionId": "arcaHomologacionEmitirPrueba",
                    "region": "us-central1"
                  }
                }
              ]
            }
          }
          EOF
      - name: Deploy isolated preview channel
        run: firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Smoke test homologation route
        shell: bash
        run: |
          URL='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app/api/homologacion'
          ORIGIN='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app'
          echo '--- OPTIONS with preview Origin ---'
          curl -sS -i -X OPTIONS "$URL" -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type' || true
          echo
          echo '--- POST without auth (expected 401 JSON + preview ACAO) ---'
          curl -sS -i -X POST "$URL" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}' || true
