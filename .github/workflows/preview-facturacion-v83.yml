name: Preview Facturacion V83

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'facturadorIntegralV83.js'
      - 'facturacionEntregaUIV84.js'
      - 'facturacionPuestoV83.js'
      - 'facturacionDriveRetryUIV83.js'
      - 'facturacionAnticiposV85.js'
      - 'facturacionCobranzasBridgeV68.js'
      - 'cobranzasUnificadasV69.js'
      - 'cobranzasEstadoGestionV70.js'
      - 'cobranzasIntegralV73.js'
      - 'cobranzasUnificadasStableV76.js'
      - 'cobranzasVistaUnificadaV98.js'
      - 'index.html'
      - 'functions/**'
      - '.github/workflows/preview-facturacion-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate unified Cobranzas V99
        shell: bash
        run: |
          set -e
          node --check cobranzasVistaUnificadaV98.js
          node --check facturacionDriveRetryUIV83.js
          node --check facturadorIntegralV83.js
          node --check facturacionEntregaUIV84.js
          node --check functions/index.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/facturaDrive2026.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          v99=Path('cobranzasVistaUnificadaV98.js').read_text(encoding='utf-8')
          required=['TIZ V99','Por cobrar · facturación y gestión','00009-00000001','1OW0DBW9pH-QslFHdVJ--LHE2_q81s2jn','Buscar OT, cliente o descripción','priorRender','PDF pendiente','En Drive']
          for token in required:
              if token not in v99: raise SystemExit(f'V99 missing: {token}')
          for bad in ['MutationObserver','setInterval(']:
              if bad in v99: raise SystemExit(f'V99 must not poll/mutate continuously: {bad}')
          if ".filter(o=>status(o)!=='Cobrado'" in v99:
              raise SystemExit('V99 must not hide an outstanding balance only because of stale status')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          v99_tag='<script src="cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915"></script>'
          drive_tag='<script src="facturacionDriveRetryUIV83.js?v=TIZ-V97-DRIVE-SIN-DOM-20260914"></script>'

          s=re.sub(r'\n?<script src="cobranzasVistaUnificadaV98\.js\?v=[^"]+"></script>\n?', '\n', s)
          s=re.sub(r'\n?<script src="facturacionDriveRetryUIV83\.js\?v=[^"]+"></script>\n?', '\n', s)

          body_idx=s.rfind('</body>')
          html_idx=s.rfind('</html>')
          if body_idx < 0 or html_idx < 0 or body_idx > html_idx:
              raise SystemExit('index.html has invalid final body/html structure')

          loaders=drive_tag+'\n'+v99_tag+'\n'
          s=s[:body_idx]+loaders+s[body_idx:]

          if s.count(v99_tag) != 1:
              raise SystemExit('V99 loader must appear exactly once')
          if s.count(drive_tag) != 1:
              raise SystemExit('Drive retry loader must appear exactly once')
          expected_tail=drive_tag+'\n'+v99_tag+'\n</body>\n</html>'
          if not s.rstrip().endswith(expected_tail):
              raise SystemExit('runtime loaders are not immediately before the final body/html close')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit repaired V99 loader placement
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "TIZ Preview Validator"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git diff --cached --check
            git commit -m "Repair Cobranzas V99 loader placement"
            git push origin HEAD:codex/facturacion-cobranzas-integral-v1
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase authentication
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIZ_APP }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "No Firebase credential is configured. Add FIREBASE_SERVICE_ACCOUNT_TIZ_APP (recommended) or refresh FIREBASE_TOKEN."
            exit 1
          fi

      - name: Validate Firebase authentication
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase projects:list --json --non-interactive >/tmp/firebase-projects.json
          else
            firebase projects:list --json --token "$FIREBASE_TOKEN" --non-interactive >/tmp/firebase-projects.json
          fi
          grep -q 'tiz---app' /tmp/firebase-projects.json

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy email delivery function
        id: email_function
        continue-on-error: true
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --non-interactive
          else
            firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
          fi

      - name: Report email function status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.email_function.outcome }}" != "success" ]; then
            echo "Email function deploy is blocked by IAM and is not a prerequisite for the Cobranzas V99 hosting preview smoke test."
          fi

      - name: Prepare Firebase preview config
        shell: bash
        run: |
          cat > firebase.preview.json <<'EOF'
          {"hosting":{"public":".","ignore":["firebase.preview.json","firebase.json",".firebaserc",".git/**",".github/**","functions/**","node_modules/**"]}}
          EOF

      - name: Deploy isolated preview channel
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --non-interactive
          else
            firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
          fi

      - name: Smoke test unified Cobranzas V99
        shell: bash
        run: |
          set -e
          ORIGIN='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app'
          curl -fsSL "$ORIGIN/cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915" -o /tmp/v99.js
          node --check /tmp/v99.js
          grep -F '00009-00000001' /tmp/v99.js
          grep -F 'Buscar OT, cliente o descripción' /tmp/v99.js
          grep -F 'priorRender' /tmp/v99.js
          if grep -Eq 'MutationObserver|setInterval\(' /tmp/v99.js; then exit 1; fi
          curl -fsSL "$ORIGIN/" -o /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          tag='<script src="cobranzasVistaUnificadaV98.js?v=TIZ-V99-BUSCADOR-FC0001-20260915"></script>'
          drive='<script src="facturacionDriveRetryUIV83.js?v=TIZ-V97-DRIVE-SIN-DOM-20260914"></script>'
          if s.count(tag) != 1: raise SystemExit('deployed V99 loader count is not 1')
          if s.count(drive) != 1: raise SystemExit('deployed Drive loader count is not 1')
          expected_tail=drive+'\n'+tag+'\n</body>\n</html>'
          if not s.rstrip().endswith(expected_tail): raise SystemExit('deployed runtime loaders are not at the final document boundary')
          PY
