name: Preview Facturacion V83

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'facturadorIntegralV83.js'
      - 'facturacionEntregaUIV84.js'
      - 'facturacionPuestoV83.js'
      - 'facturacionDriveRetryUIV83.js'
      - 'facturacionAnticiposV85.js'
      - 'index.html'
      - 'functions/**'
      - '.github/workflows/preview-facturacion-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and prepare V94 preview
        shell: bash
        run: |
          node --check facturadorIntegralV83.js
          node --check facturacionEntregaUIV84.js
          node --check facturacionDriveRetryUIV83.js
          node --check facturacionAnticiposV85.js
          node --check functions/index.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/facturaDrive2026.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          retry=Path('facturacionDriveRetryUIV83.js').read_text(encoding='utf-8')
          for token in ['obtenerDriveAccessTokenTizV91','reauthenticateWithPopup','fv91-pdf-recover','Archivar PDF']:
              if token not in retry: raise SystemExit(f'missing Drive token: {token}')
          for bad in ['reauthenticateWithRedirect','MutationObserver','setInterval(']:
              if bad in retry: raise SystemExit(f'Drive controller must not contain: {bad}')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pattern=r'\s*<script src="facturacionDriveRetryUIV83\.js\?v=[^"]+"></script>\s*'
          s,n=re.subn(pattern,'\n',s)
          if n<1: raise SystemExit('Drive retry script tag not found')
          tag='<script src="facturacionDriveRetryUIV83.js?v=TIZ-FACTURACION-DRIVE-V94-FINAL-20260914"></script>'
          if '</body>' not in s: raise SystemExit('body closing tag not found')
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          out=p.read_text(encoding='utf-8')
          if out.count(tag)!=1: raise SystemExit('V94 script tag invalid')
          if out.rfind(tag) < out.rfind('<script'): raise SystemExit('Drive controller is not the last script')
          PY

      - name: Commit final script order
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "TIZ Preview Validator"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git diff --cached --check
            git commit -m "Load Drive controller last V94"
            git push origin HEAD:codex/facturacion-cobranzas-integral-v1
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy email delivery function
        run: firebase deploy --only functions:facturacionEnviarEmailV84 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Prepare Firebase preview config
        shell: bash
        run: |
          cat > firebase.preview.json <<'EOF'
          {"hosting":{"public":".","ignore":["firebase.preview.json","firebase.json",".firebaserc",".git/**",".github/**","functions/**","node_modules/**"]}}
          EOF

      - name: Deploy isolated preview channel
        run: firebase hosting:channel:deploy facturacion-v83-pruebas --expires 7d --config firebase.preview.json --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Smoke test served V94 assets
        shell: bash
        run: |
          ORIGIN='https://tiz---app--facturacion-v83-pruebas-h6sjmm0g.web.app'
          RETRY="$ORIGIN/facturacionDriveRetryUIV83.js?v=TIZ-FACTURACION-DRIVE-V94-FINAL-20260914"
          curl -fsSL "$RETRY" -o /tmp/retry.js
          grep -F 'obtenerDriveAccessTokenTizV91' /tmp/retry.js
          grep -F 'reauthenticateWithPopup' /tmp/retry.js
          grep -F 'fv91-pdf-recover' /tmp/retry.js
          if grep -Fq 'reauthenticateWithRedirect' /tmp/retry.js; then exit 1; fi
          if grep -Fq 'MutationObserver' /tmp/retry.js; then exit 1; fi
          if grep -Fq 'setInterval(' /tmp/retry.js; then exit 1; fi
          node --check /tmp/retry.js
          curl -fsSL "$ORIGIN/" -o /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          tag='<script src="facturacionDriveRetryUIV83.js?v=TIZ-FACTURACION-DRIVE-V94-FINAL-20260914"></script>'
          assert s.count(tag)==1
          assert s.rfind(tag)>=s.rfind('<script')
          PY
