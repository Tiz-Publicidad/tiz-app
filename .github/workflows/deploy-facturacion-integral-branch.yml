name: Deploy Facturacion Integral Redesign

on:
  push:
    branches:
      - codex/cobranzas-redesign-v1
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-facturacion-integral-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: codex/cobranzas-redesign-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Validate syntax and V88 billing changes
        run: |
          node --check allFunctionsV86.js
          node --check index.js
          node --check facturacionIntegralApiV83.js
          node --check facturacionDriveRetryV83.js
          node --check facturacionRecuperarV86.js
          node --check facturaDrive2026.js
          node --check arcaFiscalCoreV83.js
          grep -q 'cobranzas-redesign-v1-dr1okhce.web.app' facturacionIntegralApiV83.js
          grep -q 'driveAccessToken' facturacionIntegralApiV83.js
          grep -q 'saldoPresupuestoNeto' facturacionIntegralApiV83.js
          grep -q 'receptorIva' facturaDrive2026.js
          grep -q 'LOGO_URL' facturaDrive2026.js
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase authentication for functions
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIZ_APP }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          # The service account used by Hosting lacks iam.serviceAccounts.ActAs.
          # Prefer the existing Firebase CLI token for Cloud Functions deploys.
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          else
            echo "No Firebase credential configured"
            exit 1
          fi

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy Facturacion V88 backend and recovery functions
        shell: bash
        run: |
          set -e
          if [ "$FIREBASE_AUTH_MODE" = "token" ]; then
            firebase deploy --only functions:facturacionIntegralEmitirV83,functions:facturacionReintentarDriveV83,functions:facturacionRecuperarHistoricosV86 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
          else
            firebase deploy --only functions:facturacionIntegralEmitirV83,functions:facturacionReintentarDriveV83,functions:facturacionRecuperarHistoricosV86 --project tiz---app --non-interactive
          fi
