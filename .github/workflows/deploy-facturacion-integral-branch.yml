name: Deploy Facturacion Integral Branch

on:
  push:
    branches:
      - codex/fc-manual-0003-nota-credito
  pull_request:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'tests/facturacionManualV2.test.js'
      - '.github/workflows/deploy-facturacion-integral-branch.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/fc-manual-0003-nota-credito'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/fc-manual-0003-nota-credito

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Validate syntax
        run: |
          node --check allFunctionsV86.js
          node --check index.js
          node --check facturacionIntegralApiV83.js
          node --check facturacionDriveRetryV83.js
          node --check facturacionRecuperarV86.js
          node --check facturaDrive2026.js
          node --check arcaFiscalCoreV83.js
          node --test ../tests/facturacionManualV2.test.js
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate GitHub to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: tiz---app
          workload_identity_provider: projects/52620104053/locations/global/workloadIdentityPools/github-arca-constancia/providers/tiz-app
          service_account: github-arca-constancia@tiz---app.iam.gserviceaccount.com

      - name: Check Firebase project access
        run: firebase projects:list --json --non-interactive | grep -q 'tiz---app'

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy Facturacion V83 and recovery V86 functions
        run: firebase deploy --only functions:facturacionIntegralEmitirV83 --project tiz---app --non-interactive

      - name: Record deploy result for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          printf '{"state":"%s","context":"facturacion-v83-pv0003","description":"Deploy %s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$JOB_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/deploy-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/deploy-status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
