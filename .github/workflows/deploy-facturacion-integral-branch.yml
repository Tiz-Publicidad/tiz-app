name: Deploy Facturacion Integral Redesign

on:
  push:
    branches:
      - codex/cobranzas-redesign-v1
    paths:
      - 'functions/**'
      - 'facturadorIntegralV83.js'
      - 'facturacionDriveRetryUIV83.js'
      - 'facturacionEntregaUIV84.js'
      - 'facturacionCobranzasDataV1.js'
      - 'scripts/facturacionContractV89.js'
      - '.github/workflows/deploy-facturacion-integral-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: codex/cobranzas-redesign-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Validate syntax and V89 billing contracts
        shell: bash
        run: |
          set -e
          node --check functions/allFunctionsV86.js
          node --check functions/index.js
          node --check functions/facturacionIntegralApiV83.js
          node --check functions/facturacionDriveRetryV83.js
          node --check functions/facturacionRecuperarV86.js
          node --check functions/facturaDrive2026.js
          node --check functions/facturacionEntregaV84.js
          node --check functions/arcaFiscalCoreV83.js
          node --check facturadorIntegralV83.js
          node --check facturacionDriveRetryUIV83.js
          node --check facturacionEntregaUIV84.js
          node --check scripts/facturacionContractV89.js
          node scripts/facturacionContractV89.js
          grep -q 'cobranzas-redesign-v1-dr1okhce.web.app' functions/facturacionIntegralApiV83.js
          grep -q 'const PTO=3' functions/facturacionIntegralApiV83.js
          grep -q 'driveAccessToken' functions/facturacionIntegralApiV83.js
          grep -q 'facturasArca:allDrive' functions/facturacionIntegralApiV83.js
          grep -q 'receptorIva' functions/facturaDrive2026.js
          grep -q 'LOGO_URL' functions/facturaDrive2026.js
          grep -q 'facturasArca:updated' functions/facturacionEntregaV84.js

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIZ_APP }}
        run: |
          set -e
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Falta FIREBASE_SERVICE_ACCOUNT_TIZ_APP"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          DEPLOYER_EMAIL=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/firebase-service-account.json','utf8'));process.stdout.write(x.client_email||'')")
          if [ -z "$DEPLOYER_EMAIL" ]; then
            echo "La credencial no contiene client_email"
            exit 1
          fi
          echo "DEPLOYER_EMAIL=$DEPLOYER_EMAIL" >> "$GITHUB_ENV"
          echo "Deployer service account: $DEPLOYER_EMAIL"

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy Facturacion V89 backend, recovery and delivery functions
        shell: bash
        run: |
          set +e
          OUT=$(firebase deploy --only functions:facturacionIntegralEmitirV83,functions:facturacionReintentarDriveV83,functions:facturacionRecuperarHistoricosV86,functions:facturacionEnviarEmailV84 --project tiz---app --non-interactive 2>&1)
          CODE=$?
          printf '%s\n' "$OUT"
          if [ $CODE -ne 0 ] && printf '%s' "$OUT" | grep -q 'iam.serviceAccounts.ActAs'; then
            echo "::error title=Falta permiso IAM para desplegar Functions::Otorgar roles/iam.serviceAccountUser sobre tiz---app@appspot.gserviceaccount.com a $DEPLOYER_EMAIL. Es un permiso de deploy; no modifica ARCA ni datos."
            echo "Abrir IAM del proyecto tiz---app y agregar al principal $DEPLOYER_EMAIL el rol Service Account User sobre tiz---app@appspot.gserviceaccount.com."
          fi
          exit $CODE
