name: Deploy Facturacion Integral Branch

on:
  push:
    branches:
      - codex/facturacion-cobranzas-integral-v1
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-facturacion-integral-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/facturacion-cobranzas-integral-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Validate syntax
        run: |
          node --check allFunctionsV86.js
          node --check index.js
          node --check facturacionIntegralApiV83.js
          node --check facturacionDriveRetryV83.js
          node --check facturacionRecuperarV86.js
          node --check facturaDrive2026.js
          node --check arcaFiscalCoreV83.js
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Falta FIREBASE_TOKEN"
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Configure issuer environment
        shell: bash
        working-directory: functions
        run: |
          cat > .env.tiz---app <<'EOF'
          ARCA_ISSUER_RAZON_SOCIAL=SixSigma SRL
          ARCA_ISSUER_NOMBRE_FANTASIA=TIZ Publicidad
          ARCA_ISSUER_DOMICILIO=Mosconi 1234, Los Polvorines, Buenos Aires
          ARCA_ISSUER_CONDICION_IVA=Responsable Inscripto
          EOF

      - name: Deploy Facturacion V83 and recovery V86 functions
        run: firebase deploy --only functions:facturacionIntegralEmitirV83,functions:facturacionReintentarDriveV83,functions:facturacionRecuperarHistoricosV86 --project tiz---app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
