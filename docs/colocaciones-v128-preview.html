<script>
window.__TIZ_COLOCACIONES_DEMO__=true;window.currentUser={email:'demo@example.test',role:'Admin'};window.currentPage='colocaciones';window.canViewPage=()=>true;window.canAnnotateSector=()=>true;window.refreshCurrent=()=>{};window.showToast=x=>document.getElementById('demo-status').textContent=x;window.DB={clientes:[],presupuestos:[],obras:[]};

</script><script src="../functions/colocacionesCoreV129.js?v=TIZ-COLOCACIONES-V130-20261008"></script><script src="../colocacionesGeneralUIV129.js?v=TIZ-COLOCACIONES-V130-20261008"></script><script src="../colocacionesV128.js?v=TIZ-COLOCACIONES-V130-20261008"></script><script>
const C=window.TIZColocacionesCore,d=C.today();

window.DB.obras.push({id:'demo3',ot:'DEMO-3',cliente:'Segundo local CABA',desc:'Letras corpóreas',estado:'Aprobado',entregaLogistica:{domicilio:'Av. Santa Fe 1500, CABA'},colocacionesGestion:{legacyCapturada:true,zona:'CABA',tipoTrabajo:'Letras corpóreas',acciones:{relevar:{id:'relevar',titulo:'Verificar medidas y anclajes',tipo:'Relevamiento',fecha:d,responsable:'Ariel',estado:'Pendiente',todoDia:true}}}},{id:'demo4',ot:'DEMO-4',cliente:'Tercer local CABA',desc:'Reparación de cartel',estado:'Aprobado',entregaLogistica:{domicilio:'Callao 900, CABA'},colocacionesGestion:{legacyCapturada:true,zona:'CABA',tipoTrabajo:'Reparación',acciones:{entregar:{id:'entregar',titulo:'Entregar piezas de reparación',tipo:'Entrega',fecha:d,responsable:'Ariel',estado:'Pendiente',todoDia:true}}}});

window.colocacionesApiV129=async p=>{const G=window.TIZColocacionesGeneralCore,at=new Date().toISOString();if(p.mode==='list')return {ok:true,rows:structuredClone(demoDrafts.filter(a=>!a.obraId))};if(p.mode==='save'){const a=G.cleanAction(p.action),idx=demoDrafts.findIndex(x=>x.id===a.id);if(idx>=0&&demoDrafts[idx].actualizadoEn!==p.version)throw Error('El pendiente cambió');a.actualizadoEn=at;a.registroId='sinOT/'+a.id;if(p.obraId){const o=window.DB.obras.find(x=>x.id===p.obraId);if(!o||o.colocacionesGestion.acciones[a.id])throw Error('No se pudo asociar');o.colocacionesGestion.acciones[a.id]=structuredClone(a);a.obraId=o.id}if(idx>=0)demoDrafts[idx]=a;else demoDrafts.push(a);return {ok:true,id:a.id,obraId:a.obraId||''}}if(p.mode==='link'){const a=demoDrafts.find(x=>x.id===p.id),o=window.DB.obras.find(x=>x.id===p.obraId);if(!a||!o||a.obraId)throw Error('No se pudo asociar');o.colocacionesGestion.acciones[a.id]=structuredClone(a);a.obraId=o.id;return {ok:true}}if(p.mode==='plan'){for(const item of p.selections){const o=window.DB.obras.find(x=>x.id===item.obraId);G.planPatch(o,[item],p.day,'demo',window.currentUser.email,at)}for(const item of p.selections){const o=window.DB.obras.find(x=>x.id===item.obraId);C.applyPatch(o,G.planPatch(o,[item],p.day,'demo',window.currentUser.email,at))}return {ok:true,count:p.selections.length}}throw Error('La vista de prueba no guarda archivos en Drive. En la app real se usa la carpeta de la OT.')};
