  if (!s) return null;

  if (l==='entregado') return 'Entregado';

}

window.actualizarDatos = async function() {
  const btn = document.getElementById('btnActualizar');
  btn.disabled = true; btn.textContent = 'Actualizando...';

  log('Leyendo obras en Firebase...', 'info');
  const snap = await db.collection('obras').get();
  const obras = [];
  snap.forEach(d => obras.push({id: d.id, ...d.data()}));
  log(`${obras.length} obras encontradas en Firebase`, 'info');

  // Crear índice por OT para búsqueda rápida
  const porOT = {};
  obras.forEach(o => {
    const ot = String(o.ot||'').replace(/^0+/,'').trim();
    if (ot) {
      if (!porOT[ot]) porOT[ot] = [];
      porOT[ot].push(o);
    }
  });

  let actualizadas = 0;
  let noEncontradas = 0;
  let sinCambios = 0;
  let total = DATOS_PLANILLA.length;

  for (let i = 0; i < DATOS_PLANILLA.length; i++) {
    const dato = DATOS_PLANILLA[i];
    const ot = String(dato.ot||'').replace(/^0+/,'').trim();
    setP(Math.round((i/total)*100));

    const matches = porOT[ot] || [];
    if (!matches.length) {
      log(`OT ${ot}: no encontrada en Firebase`, 'warn');
      noEncontradas++;
      continue;
    }

    // Actualizar todas las obras que coincidan con esa OT
    for (const obra of matches) {
      const update = {};
      if (dato.nrfc && dato.nrfc !== 'N/A' && dato.nrfc !== obra.nrfc) update.nrfc = dato.nrfc;
      if (dato.ffc && dato.ffc !== obra.ffc) update.ffc = dato.ffc;
      if (dato.cobr && dato.cobr !== obra.cobr) {
        update.cobr = dato.cobr;
        update.estado = dato.cobr; // sincronizar estado principal
      }
      if (dato.oc && dato.oc !== obra.oc) update.oc = dato.oc;

      if (Object.keys(update).length === 0) { sinCambios++; continue; }

      await db.collection('obras').doc(obra.id).update(update);
      actualizadas++;
      if (actualizadas % 10 === 0) log(`${actualizadas} obras actualizadas...`, 'ok');
    }
  }

  setP(100);
  log(`✓ ACTUALIZACIÓN COMPLETA`, 'ok');
  log(`  ✓ ${actualizadas} obras actualizadas con nuevos datos`, 'ok');
  log(`  — ${sinCambios} obras sin cambios (ya tenían los datos)`, 'info');
  log(`  ✗ ${noEncontradas} OTs no encontradas en Firebase`, 'warn');

  document.getElementById('summary').style.display = 'block';
  document.getElementById('summary').innerHTML = `
    <h3 style="color:#e8b84b;font-size:14px;margin-bottom:12px">Resumen de actualización</h3>
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:#4caf7d">${actualizadas}</div><div class="stat-l">Obras actualizadas</div></div>
      <div class="stat"><div class="stat-n" style="color:#5b9cf6">${sinCambios}</div><div class="stat-l">Sin cambios</div></div>
      <div class="stat"><div class="stat-n" style="color:#e8a020">${noEncontradas}</div><div class="stat-l">OTs no encontradas</div></div>
    </div>
    <p style="color:#a09e9a;font-size:12px;margin-top:12px">Ya podés abrir la app TIZ — las obras ahora tienen los números de factura y estados actualizados.</p>
  `;

  btn.textContent = '¡Listo!';
  document.getElementById('btnSoloNuevas').disabled = false;
};

window.verObrasFirebase = async function() {
  log('Cargando lista de obras...', 'info');
  const snap = await db.collection('obras').get();
  const obras = [];
  snap.forEach(d => obras.push({id: d.id, ...d.data()}));
  obras.sort((a,b) => (b.semana||0)-(a.semana||0));

  const sinFC = obras.filter(o => !o.nrfc && ['Cobrado','Facturado'].includes(o.estado));
  const conFC = obras.filter(o => o.nrfc);

  log(`Total obras: ${obras.length}`, 'info');
  log(`Con número de factura: ${conFC.length}`, 'ok');
  log(`Cobradas/Facturadas SIN número de factura: ${sinFC.length}`, 'warn');
  if (sinFC.length) {
    sinFC.slice(0,10).forEach(o => log(`  OT ${o.ot||'—'} — ${o.desc?.substring(0,40)} — ${o.estado}`, 'warn'));
  }
};
